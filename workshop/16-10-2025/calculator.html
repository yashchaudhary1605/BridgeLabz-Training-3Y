<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator UI - HTML & CSS</title>
  <style>
    
    
    
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      
      align-items:center;
      justify-content:center;
      padding:24px;
  
    }

    
    .calc {
      width: 360px;      
      max-width: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));
      border-radius: var(--radius);
      box-shadow: 0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.02);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.03);
    }

    
    .display {
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.03));
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .display .prev {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: right;
      min-height: 18px;
      word-wrap:break-word;
    }
    .display .current {
      font-size: 2.1rem;
      font-weight: 600;
      text-align: right;
      letter-spacing: 0.6px;
      min-height: 42px;
      word-wrap:break-word;
    }

    /* Buttons grid */
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.02), rgba(2,6,23,0.02));
    }

    button.calc-btn{
      -webkit-appearance: none;
      appearance: none;
      border: none;
      padding: 16px;
      font-size: 1.05rem;
      border-radius: 10px;
      cursor: pointer;
      background: var(--button);
      color: var(--text);
      box-shadow: 0 6px 12px rgba(2,6,23,0.45);
      transition: transform .08s ease, box-shadow .12s ease, background .12s linear;
      outline: none;
    }
    button.calc-btn:active{ transform: translateY(2px); box-shadow: 0 3px 8px rgba(2,6,23,0.6); }

   
    button.btn-wide{ grid-column: span 2; } 
    
    button.btn-equal {
      background: linear-gradient(180deg, var(--accent), #059669);
      color: #071422;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(3, 105, 85, 0.28);
    }

    
    
  </style>
</head>
<body>

  <div class="calc" role="application" aria-label="Calculator">
    <div class="display" aria-hidden="true">
      <div class="prev">0</div>
      <div class="current">0</div>
    </div>

    <div class="keys" role="group" aria-label="Calculator keys">
    
      <button class="calc-btn btn-op" aria-label="Clear">AC</button>
      <button class="calc-btn btn-op" aria-label="Toggle sign">+/-</button>
      <button class="calc-btn btn-op" aria-label="Percent">%</button>
      <button class="calc-btn btn-op" aria-label="Divide">÷</button>

   
      <button class="calc-btn" aria-label="Seven">7</button>
      <button class="calc-btn" aria-label="Eight">8</button>
      <button class="calc-btn" aria-label="Nine">9</button>
      <button class="calc-btn btn-op" aria-label="Multiply">×</button>

     
      <button class="calc-btn" aria-label="Four">4</button>
      <button class="calc-btn" aria-label="Five">5</button>
      <button class="calc-btn" aria-label="Six">6</button>
      <button class="calc-btn btn-op" aria-label="Subtract">−</button>

      
      <button class="calc-btn" aria-label="One">1</button>
      <button class="calc-btn" aria-label="Two">2</button>
      <button class="calc-btn" aria-label="Three">3</button>
      <button class="calc-btn btn-op" aria-label="Add">+</button>

     
      <button class="calc-btn btn-wide" aria-label="Zero">0</button>
      <button class="calc-btn" aria-label="Decimal">.</button>
      <button class="calc-btn btn-equal" aria-label="Equals">=</button>
    </div>

    

</body>
</html>
