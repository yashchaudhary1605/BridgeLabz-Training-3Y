<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Basic Smiley</title>
  <style>
   
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: Arial, sans-serif;
    }

   
    .face {
      width: 200px;            
      height: 200px;
      background: #ffdd57;    
      border-radius: 50%;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
    }

    
    .eye {
      width: 26px;
      height: 26px;
      background: #222;
      border-radius: 50%;
      position: absolute;
      top: 60px;
    }
    .eye.left { left: 56px; }
    .eye.right { right: 56px; }

   
    .mouth {
      width: 120px;
      height: 70px;
      border-bottom: 6px solid #222;
      border-radius: 0 0 60px 60px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 36px;
      background: transparent;
      overflow: hidden;
    }

  
    .mouth::after {
      content: "";
      display: block;
      width: 100%;
      height: 40%;
      background: rgba(0,0,0,0.03);
      position: absolute;
      bottom: 0;
      left: 0;
      border-bottom-left-radius: 60px;
      border-bottom-right-radius: 60px;
    }
  </style>
</head>
<body>
  <div class="face" role="img" aria-label="Smiling face">
    <div class="eye left" aria-hidden="true"></div>
    <div class="eye right" aria-hidden="true"></div>
    <div class="mouth" aria-hidden="true"></div>
  </div>
</body>
</html>
